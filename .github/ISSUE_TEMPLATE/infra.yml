name: 🔧 Инфраструктура
description: CI, сборка, деплой, мониторинг
labels: [infra]
body:
  - type: textarea
    id: what
    attributes:
      label: Что нужно сделать
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Зачем / последствия если не сделать
  - type: textarea
    id: notes
    attributes:
      label: Замечания (серверы, домены, доступы — без секретов!)
