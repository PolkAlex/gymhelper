# Лёгкий CI: Java-сборка с контрактным тестом + статические проверки JS и e2e (desktop).
run-name: "CI: ${{ github.ref_name }}"

on:
  push:
  pull_request:

# Новые прогоны отменяют устаревшие на той же ветке (экономия минут Actions)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-build:
    name: "Java: сборка + контрактный тест"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Кэш Gradle: зависимости и wrapper не качаются заново на каждый запуск
      - uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('*.gradle', 'gradle/wrapper/*') }}
          restore-keys: gradle-

      # build = компиляция + jar + контрактный тест (задача contractTest включена в check)
      - name: Сборка и проверка
        run: ./gradlew --no-daemon build

  js-tests:
    name: "JS: статика + e2e (desktop)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # Статические проверки фронтенда
      - name: Синтаксис JS
        run: |
          node --check web/app.js
          node --check web/catalog.js

      - name: Проверки каталога и ACTIONS
        run: node tests/check.js

      # e2e: только desktop-профиль; тестовый сервер поднимается сам
      # (webServer в playwright.config.js -> tests/server-test.js, порт 8099)
      - name: Установка Chromium
        run: npx playwright install --with-deps chromium

      - name: Прогон e2e (desktop)
        run: npx playwright test --project=desktop
