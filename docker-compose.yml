# Прод-запуск GymHelper на VPS. Образ тянется из ghcr.io — его публикует CI на push в main,
# локально ничего не собирается (на VPS 1 GB RAM сборка невозможна). Рядом лежит .env с токеном.
services:
  gymbot:
    image: ghcr.io/polkalex/gymhelper:latest
    container_name: gymbot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # токен берётся из файла .env рядом с compose (в .gitignore)
      - GYM_BOT_TOKEN=${GYM_BOT_TOKEN:?не задан GYM_BOT_TOKEN — создайте .env со строкой GYM_BOT_TOKEN=...}
      - GYM_PORT=8080
      # публикуем порт только на loopback хоста (127.0.0.1:8080), поэтому внутри контейнера слушаем все интерфейсы
      - GYM_BIND_ADDR=0.0.0.0
      # URL кнопки Mini App: перенесите содержимое webapp.txt в .env на VPS (GYM_WEBAPP_URL=...)
      - GYM_WEBAPP_URL=${GYM_WEBAPP_URL:-}
      # chat id владельца для admin-команды /announce [UX-T16]: перенесите в .env на VPS (GYM_ADMIN_CHAT_ID=...)
      - GYM_ADMIN_CHAT_ID=${GYM_ADMIN_CHAT_ID:-}
      # токен эндпоинта /stats [ANA-T1]: перенесите в .env на VPS (GYM_ADMIN_TOKEN=...);
      # не задан — /stats доступен с токеном бота (GYM_BOT_TOKEN)
      - GYM_ADMIN_TOKEN=${GYM_ADMIN_TOKEN:-}
      # chat id владельца для «Написать разработчику» [ONB-T8]: перенесите в .env на VPS
      # (GYM_OWNER_CHAT_ID=...); не задан — фича off (бот отвечает «Канал связи временно недоступен»)
      - GYM_OWNER_CHAT_ID=${GYM_OWNER_CHAT_ID:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
