# Лёгкий CI: Java-сборка с контрактным тестом + статические проверки JS и e2e (desktop).
run-name: "CI: ${{ github.ref_name }}"

on:
  push:
  pull_request:

# Новые прогоны отменяют устаревшие на той же ветке (экономия минут Actions)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-build:
    name: "Java: сборка + контрактный тест"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Кэш Gradle: зависимости и wrapper не качаются заново на каждый запуск
      - uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('*.gradle', 'gradle/wrapper/*') }}
          restore-keys: gradle-

      # build = компиляция + jar + контрактный тест (задача contractTest включена в check)
      - name: Сборка и проверка
        run: ./gradlew --no-daemon build

  js-tests:
    name: "JS: статика + e2e (desktop)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # Статические проверки фронтенда
      - name: Синтаксис JS
        run: |
          node --check web/app.js
          node --check web/catalog.js

      - name: Проверки каталога и ACTIONS
        run: node tests/check.js

      # e2e: только desktop-профиль; тестовый сервер поднимается сам
      # (webServer в playwright.config.js -> tests/server-test.js, порт 8099)
      - name: Установка Chromium
        run: npx playwright install --with-deps chromium

      - name: Прогон e2e (desktop)
        run: npx playwright test --project=desktop

  # Сборка образа Docker. На PR — только сборка для валидации Dockerfile,
  # публикация — только на main. Имя репозитория приводится к lowercase
  # автоматически (metadata-action) → ghcr.io/polkalex/gymhelper
  docker:
    name: "Docker: build (+publish на main)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [java-build, js-tests]
    # на push в feature-ветки job не нужен: публикация только с main, сборка только на PR
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # на PR только сборка для валидации Dockerfile, публикация — только на main
      - if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Теги: latest + sha-хеш коммита; github.repository переживает переименование репо
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
