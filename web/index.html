<!doctype html>

<title>🏋️ Дневник тренировок</title>
<script src="telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css?v=55">
</head>
<body>
<div id="app"><p class="loading">Загрузка…</p></div>
<div id="restbar" class="restbar hidden"></div>
<div id="modal" class="modal hidden" data-act="modalBackdrop"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast"></div>
<div id="navSwipeHint" aria-hidden="true"></div>
<input id="bgFile" type="file" accept="image/*" style="display:none">
<input id="impFile" type="file" accept=".csv,text/csv" style="display:none">
<!-- [PRO-T1] Telegram Mini Apps Analytics SDK: вендоренный @telegram-apps/analytics (без CDN).
     Порядок важен: SDK → конфиг → app.js (tmaAnalyticsInit читает window.tmaAnalyticsConfig).
     analytics-config.js может отсутствовать (свежий клон/прод без конфига) — 404 не критичен,
     app.js тогда тихо не инициализирует аналитику.
     ⚠️ Статика отдаётся с годовым immutable-кэшем: при смене конфига на проде (ротация
     токена) ОБЯЗАТЕЛЬНО бампать ?v= у analytics-config.js — иначе новые значения не доедут
     до вернувшихся клиентов. -->
<script src="vendor/tma-analytics.js?v=1"></script>
<script src="analytics-config.js?v=1"></script>
<script src="catalog.js?v=31"></script>
<script src="importstrong.js?v=1"></script>
<script src="bodymap.js?v=1"></script>
<script src="app.js?v=67"></script>
</body>
</html>
