services:
  gymbot:
    build: .
    image: gymhelper:latest
    container_name: gymbot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # положите токен в файл .env рядом с compose (в .gitignore) или экспортируйте в шелл
      - GYM_BOT_TOKEN=${GYM_BOT_TOKEN:?не задан GYM_BOT_TOKEN}
      - GYM_PORT=8080
      # - GYM_WEBAPP_URL=https://ваш-домен.example
    volumes:
      - ./data:/app/data
