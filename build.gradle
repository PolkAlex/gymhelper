/*
 * Сборка GymHelper: чистая Java без внешних зависимостей (только JDK).
 * Gradle здесь — инструмент сборки/упаковки, в рантайм ничего не добавляет.
 */
plugins {
    id 'java'
    id 'application'
}

group = 'gym'
version = '1.0.0'

// нестандартная структура проекта: пакет gym лежит прямо в src/ (src/gym/*.java)
sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        /* [UX-S16] bundled шрифты постера (src/gym/web/fonts/*.ttf + LICENSE) едут
            в jar как ресурсы рядом с классами (gym/web/fonts/...); *.java из
            resources исключается Gradle автоматически */
        resources {
            srcDirs = ['src']
        }
    }
    // контрактный тест формата данных (tests/GymContractTest.java, default package)
    contractTest {
        java {
            srcDirs = ['tests']
        }
        compileClasspath += sourceSets.main.output
        /* [UX-S16] main.runtimeClasspath = классы + ресурсы (шрифты CardRender —
            рендер PNG гоняется в контракте) + пустая runtime-конфигурация */
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17 // байткод Java 17, собирается любым JDK >= 17
}

application {
    mainClass = 'gym.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'gym.Main'
    }
    archiveBaseName = 'gymhelper'
}

// запуск: gradlew contractTest
tasks.register('contractTest', JavaExec) {
    group = 'verification'
    description = 'Контрактный тест формата данных (app <-> сервер).'
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = 'GymContractTest'
}

// юнит-тесты чистой логики бота [TST-S1]: tests/BotLogicTest.java (пакет gym — доступ
// к package-private статикам BotLogic/Records без рефлексии)
tasks.register('botLogicTest', JavaExec) {
    group = 'verification'
    description = 'Юнит-тесты логики BotLogic/Records (без Telegram Api).'
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = 'gym.BotLogicTest'
}

// проверка: gradlew check -> build + контрактный тест + юнит-тесты логики
tasks.named('check') {
    dependsOn 'contractTest', 'botLogicTest'
}
