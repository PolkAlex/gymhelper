name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java: сборка + контрактный тест
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка и проверка (build включает контрактный тест)
        run: ./gradlew --no-daemon build

      - name: Публикация jar как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: gymhelper-jar
          path: build/libs/gymhelper-*.jar
          retention-days: 7

  e2e:
    name: Playwright e2e: 4 устройства
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Установка браузеров Chromium + WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Прогон e2e (desktop, iphone13, pixel7, android360)
        run: npx playwright test

      - name: Артефакт с отчётом при падении
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
