name: tests-and-deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: JS syntax
        run: |
          node --check web/app.js
          node --check web/catalog.js

      - name: Static checks
        run: node tests/check.js

      - name: Compile
        run: javac -encoding UTF-8 -d out $(find src -name '*.java')

      - name: Contract test
        run: |
          javac -encoding UTF-8 -cp out -d testout tests/GymContractTest.java
          java -cp "out:testout" GymContractTest

      - name: Upload to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: 'src,web'
          target: '/opt/gym'
          strip_components: 0
          overwrite: true

      - name: Compile on server and restart bot
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/gym
            javac -encoding UTF-8 -d out $(find src -name '*.java')
            systemctl restart gymbot
            echo "Deploy OK: $(date)"
