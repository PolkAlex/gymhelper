name: tests-and-deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: JS syntax
        run: |
          node --check web/app.js
          node --check web/catalog.js

      - name: Static checks
        run: node tests/check.js

      - name: Compile
        run: javac -encoding UTF-8 -d out $(find src -name '*.java')

      - name: Contract test
        run: |
          javac -encoding UTF-8 -cp out -d testout tests/GymContractTest.java
          java -cp "out:testout" GymContractTest

      - name: Deploy guard
        id: guard
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "SSH secrets not configured - deploy skipped"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH key
        if: steps.guard.outputs.deploy == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload to server
        if: steps.guard.outputs.deploy == 'true'
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r src web root@${{ secrets.SSH_HOST }}:/opt/gym/

      - name: Compile on server and restart bot
        if: steps.guard.outputs.deploy == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ secrets.SSH_HOST }} "cd /opt/gym && javac -encoding UTF-8 -d out \$(find src -name '*.java') && systemctl restart gymbot && echo Deploy OK"
